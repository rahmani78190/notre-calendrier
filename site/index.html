<html lang="fr">
<head>

<title>Notre Calendrier</title>
<meta name="description" content="Notre calendrier à deux, avec le globe de nos lieux et des rappels.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calendrier">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B131E" media="(prefers-color-scheme: dark)">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap">
<style>
/* Mise en page : calendrier à gauche, globe à droite sur grand écran ; deux onglets sur téléphone.
   Palette : encre bleu nuit, océan pâle, trois couleurs de porteur (lui, elle, ensemble). */
:root {
  --bg: #ECF0F5;
  --surface: #FFFFFF;
  --ink: #12202F;
  --muted: #5A6B80;
  --line: #D6DFE9;
  --ocean: #D2E1EE;
  --land: #FAFBFC;
  --coast: #8FA6BD;
  --grid: rgba(18, 32, 47, 0.10);
  --night: rgba(10, 20, 60, 0.16);
  --a: #2563E8;
  --b: #DB3F7A;
  --both: #D99200;
  --p1: #16A34A; --p2: #0D9488; --p3: #7C3AED; --p4: #EA580C; --p5: #DC2626; --p6: #0284C7; --p7: #9A5B13; --p8: #475569;
  --shadow: 0 1px 2px rgba(18, 32, 47, 0.06), 0 8px 24px rgba(18, 32, 47, 0.06);
  --font-display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', sans-serif;
  --font-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B131E;
    --surface: #121D2B;
    --ink: #E8EEF6;
    --muted: #8DA0B7;
    --line: #223349;
    --ocean: #0F2438;
    --land: #29405A;
    --coast: #4A6685;
    --grid: rgba(232, 238, 246, 0.08);
    --night: rgba(0, 0, 0, 0.30);
    --a: #6F9DFF;
    --b: #FF7FA9;
    --both: #FFC24A;
  --p1: #4ADE80; --p2: #2DD4BF; --p3: #A78BFA; --p4: #FB923C; --p5: #F87171; --p6: #38BDF8; --p7: #D6A26B; --p8: #94A3B8;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B131E;
  --surface: #121D2B;
  --ink: #E8EEF6;
  --muted: #8DA0B7;
  --line: #223349;
  --ocean: #0F2438;
  --land: #29405A;
  --coast: #4A6685;
  --grid: rgba(232, 238, 246, 0.08);
    --night: rgba(0, 0, 0, 0.30);
  --a: #6F9DFF;
  --b: #FF7FA9;
  --both: #FFC24A;
  --p1: #4ADE80; --p2: #2DD4BF; --p3: #A78BFA; --p4: #FB923C; --p5: #F87171; --p6: #38BDF8; --p7: #D6A26B; --p8: #94A3B8;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--a); outline-offset: 2px; }
.app { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

/* En-tête */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.top > div { min-width: 0; }
h1 {
  font-family: var(--font-display);
  font-weight: 760;
  font-size: 2.1rem;
  line-height: 1.02;
  letter-spacing: -0.025em;
  margin: 0;
  text-wrap: balance;
}
.next { margin: 6px 0 0; color: var(--muted); font-size: 0.95rem; }
.next b { color: var(--ink); font-weight: 650; }
.legend {
  display: inline-flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px;
  background: none; border: 0; padding: 4px 0; font-size: 0.85rem; color: var(--muted); text-align: left;
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot.a { background: var(--a); } .dot.b { background: var(--b); } .dot.ab { background: var(--both); }
.btn {
  min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.danger { color: #C23B3B; }
:root[data-theme="dark"] .btn.danger { color: #FF8A8A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.danger { color: #FF8A8A; } }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 0.88rem; border-radius: 10px; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
  display: inline-flex; align-items: center; justify-content: center; padding: 0; flex: none;
}

/* Bandeau d'information */
.notice {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px;
  box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px;
}
.notice p { margin: 0; color: var(--muted); }
.notice h2 { margin: 0; font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; }
.names-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.names-form .full { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
@media (max-width: 420px) { .names-form { grid-template-columns: 1fr; } }

/* Onglets (téléphone) */
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--line); border-radius: 14px; }
.tabs button { min-height: 40px; border: 0; border-radius: 10px; background: transparent; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; align-items: start; }
.pane { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
@media (max-width: 959px) {
  .app[data-view="cal"] #globePane { display: none; }
  .app[data-view="globe"] #calPane { display: none; }
}
@media (min-width: 960px) {
  .tabs { display: none; }
  .layout { grid-template-columns: minmax(340px, 430px) minmax(0, 1fr); }
  #globePane { position: sticky; top: 18px; }
  h1 { font-size: 2.5rem; }
}

/* Calendrier */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
.month-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.month-nav h2 {
  flex: 1; margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.25rem;
  letter-spacing: -0.01em; text-transform: capitalize; min-width: 0;
}
.weekdays, .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.weekdays { margin-bottom: 4px; }
.weekdays span { text-align: center; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 4px 0; }
.days { gap: 2px; }
.day {
  position: relative; height: 48px; border: 0; background: transparent; border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; padding-top: 6px;
  font-variant-numeric: tabular-nums;
}
.day .num { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.92rem; }
.day.out { color: var(--muted); opacity: 0.5; }
.day.today .num { box-shadow: inset 0 0 0 1.5px var(--ink); }
.day.sel { background: var(--ink); color: var(--bg); }
.day.sel .num { box-shadow: none; }
.day .dots { display: flex; gap: 3px; height: 6px; }
.day .dots i { width: 5px; height: 5px; border-radius: 50%; display: block; }
.day .dots i.a { background: var(--a); } .day .dots i.b { background: var(--b); } .day .dots i.ab { background: var(--both); }
.day.sel .dots i { box-shadow: 0 0 0 1px var(--ink); }
.cal-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; }

.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0; }
.section-title h3 { margin: 0; font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; text-transform: capitalize; }
.section-title span { color: var(--muted); font-size: 0.85rem; }
.list { display: flex; flex-direction: column; gap: 8px; }
.ev {
  display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 10px 12px; text-align: left; width: 100%;
}
.ev .when { font-variant-numeric: tabular-nums; font-size: 0.85rem; color: var(--muted); font-weight: 600; line-height: 1.2; }
.ev .main { min-width: 0; }
.ev .title { font-weight: 650; display: flex; align-items: center; gap: 8px; min-width: 0; }
.ev .title span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .meta { color: var(--muted); font-size: 0.85rem; display: flex; align-items: center; gap: 5px; margin-top: 2px; min-width: 0; }
.ev .meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .note { color: var(--muted); font-size: 0.85rem; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ev .go { white-space: nowrap; }
.empty {
  border: 1px dashed var(--line); border-radius: 14px; padding: 16px; color: var(--muted);
  display: flex; flex-direction: column; gap: 10px; align-items: flex-start;
}
.empty p { margin: 0; }
.up {
  display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; text-align: left;
  background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 10px 2px; border-radius: 0;
}
.up:last-child { border-bottom: 0; }
.up .chip { text-align: center; line-height: 1.05; }
.up .chip b { display: block; font-family: var(--font-display); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.up .chip small { font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.up .t { font-weight: 650; display: flex; align-items: center; gap: 8px; }
.up .m { color: var(--muted); font-size: 0.85rem; }

/* Globe */
.globe-wrap { position: relative; width: 100%; max-width: 640px; margin: 0 auto; aspect-ratio: 1 / 1; }
#globe { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; border-radius: 50%; }
#globe.drag { cursor: grabbing; }
.globe-ctl { position: absolute; right: 0; bottom: 4%; display: flex; flex-direction: column; gap: 8px; }
.globe-note { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: 0.9rem; pointer-events: none; padding: 20%; }
.pick {
  position: absolute; left: 50%; top: 2%; transform: translateX(-50%); width: max-content; max-width: 94%;
  background: var(--ink); color: var(--bg); border-radius: 14px; padding: 8px 8px 8px 14px;
  display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 0.9rem; z-index: 2;
}
.pick .btn { min-height: 34px; background: transparent; color: var(--bg); border-color: rgba(255, 255, 255, 0.35); }
.seg { display: inline-flex; padding: 3px; gap: 3px; background: var(--line); border-radius: 12px; align-self: center; }
.seg button { min-height: 34px; padding: 0 12px; border: 0; background: transparent; border-radius: 9px; font-weight: 600; font-size: 0.88rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.globe-row { display: flex; justify-content: center; }
.pincard { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.pincard h3 { margin: 0; font-family: var(--font-display); font-size: 1.15rem; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pincard .row { display: flex; align-items: center; gap: 8px; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 8px; }
.pincard .row div { min-width: 0; }
.sun { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.9rem; }
.sun i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.maplink { text-decoration: none; color: var(--ink); }
.ev .meta a { color: var(--muted); text-decoration: underline; white-space: nowrap; }
.pincard .row small { color: var(--muted); display: block; }

/* Couleurs d'événement */
.colors { display: flex; flex-wrap: wrap; gap: 7px; }
.colors button {
  width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--surface); padding: 0;
  box-shadow: 0 0 0 1px var(--line); display: inline-flex; align-items: center; justify-content: center; color: #fff;
}
.colors button[aria-pressed="true"] { box-shadow: 0 0 0 2.5px var(--ink); }
.colors button.auto { font-size: 0.56rem; font-weight: 700; letter-spacing: 0.02em; }
/* Bandeau du jour */
.todaybox { background: var(--ink); color: var(--bg); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
.todaybox h2 { margin: 0; font-family: var(--font-display); font-size: 1.15rem; font-weight: 720; }
.todaybox .trow { display: flex; align-items: center; gap: 10px; justify-content: space-between; border-top: 1px solid rgba(127,127,127,0.35); padding-top: 10px; }
.todaybox .trow div { min-width: 0; display: flex; align-items: center; gap: 8px; }
.todaybox .trow b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.todaybox .trow small { opacity: 0.75; white-space: nowrap; }
.todaybox .btn { background: var(--bg); color: var(--ink); border-color: var(--bg); text-decoration: none; white-space: nowrap; }
.pick .btn.ok { background: var(--bg); color: var(--ink); border-color: var(--bg); }
/* Formulaire */
.overlay { position: fixed; inset: 0; background: rgba(8, 14, 24, 0.55); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; max-height: 92dvh; overflow-y: auto; background: var(--surface); color: var(--ink);
  border-radius: 22px 22px 0 0; border: 1px solid var(--line);
  padding-top: 18px;
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
@media (min-width: 640px) { .overlay { align-items: center; } .sheet { border-radius: 22px; padding-bottom: 20px; } }
.sheet h2 { margin: 0; font-family: var(--font-display); font-size: 1.3rem; font-weight: 720; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .lab { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.input {
  width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
  padding: 0 12px; font-size: 16px;
}
textarea.input { padding: 10px 12px; min-height: 76px; resize: vertical; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.who { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.who button {
  min-height: 44px; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 7px;
  font-weight: 600; font-size: 0.9rem; padding: 0 6px; min-width: 0;
}
.who button span.n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.sug { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.sug button { text-align: left; border: 0; border-bottom: 1px solid var(--line); background: var(--bg); min-height: 42px; padding: 0 12px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.sug button:last-child { border-bottom: 0; }
.sug small { color: var(--muted); }
.placesel { display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--bg); }
.placesel .coords { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.placesel .line { display: flex; gap: 8px; align-items: center; }
.hint { color: var(--muted); font-size: 0.82rem; margin: 0; }
.err { color: #C23B3B; font-size: 0.85rem; margin: 0; }
:root[data-theme="dark"] .err { color: #FF8A8A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .err { color: #FF8A8A; } }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .grow { flex: 1; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60; max-width: calc(100% - 32px);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 0.9rem; box-shadow: var(--shadow);
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
/* Accueil, réglages */
.setup { position: fixed; inset: 0; z-index: 70; background: var(--bg); overflow-y: auto;
  padding: calc(28px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-left, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)); }
.setup .box { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.setup h1 { font-size: 2.3rem; }
.setup p { margin: 0; color: var(--muted); }
.setup .or { text-align: center; color: var(--muted); font-size: 0.85rem; }
.setup .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.setup .pair .btn { min-height: 64px; font-size: 1.05rem; }
.top-actions { display: flex; gap: 8px; align-items: center; flex: none; }
@media (max-width: 400px) { .top-actions #addBtn { padding: 0 12px; } }
.set-row { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }
.set-row h3 { margin: 0; font-size: 1rem; font-family: var(--font-display); }
.set-row p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.codebox { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; word-break: break-all; }
.steps { margin: 0; padding-left: 20px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.todaybox .dist { opacity: 0.75; font-size: 0.85rem; white-space: nowrap; }
</style>

<div class="setup" id="setup" hidden></div>

<div class="app" id="app" data-view="cal">
  <header class="top">
    <div>
      <h1>Notre Calendrier</h1>
      <p class="next" id="next"></p>
      <button class="legend" id="legend" type="button" aria-label="Modifier les prénoms"></button>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="setBtn" type="button" aria-label="Réglages et rappels"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
      <button class="btn primary" id="addBtn" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Ajouter
      </button>
    </div>
  </header>

  <div id="todayBox" hidden></div>

  /* ---------- Fond de carte ---------- */
  function decodeRing(str, off) {
    var out = [], px = off[0], py = off[1];
    for (var i = 0; i < str.length; i += 2) {
      var x = str.charCodeAt(i) - 64, y = str.charCodeAt(i + 1) - 64;
      x = (x >> 1) ^ (-(x & 1)); y = (y >> 1) ^ (-(y & 1));
      x += px; y += py; px = x; py = y;
      out.push([x / 1024, y / 1024]);

    return out;
  }
  function buildLand(world) {
    var polys = [];
    (world.features || []).forEach(function (f) {
      var g = f.geometry; if (!g) return;
      var enc = g.encodeOffsets;
      function ring(r, o) { return typeof r === 'string' ? decodeRing(r, o || [0, 0]) : r; }
      if (g.type === 'Polygon') polys.push(g.coordinates.map(function (r, i) { return ring(r, enc && enc[i]); }));
      else if (g.type === 'MultiPolygon') g.coordinates.forEach(function (p, pi) { polys.push(p.map(function (r, ri) { return ring(r, enc && enc[pi] && enc[pi][ri]); })); });
    });
    var TWO_PI = 2 * Math.PI;
    polys = polys.map(function (poly) {
      return poly.map(function (r, i) {
        if (!r || r.length < 3) return r;
        var a = r[0], b = r[r.length - 1];
        if (a[0] !== b[0] || a[1] !== b[1]) r = r.concat([[a[0], a[1]]]);
        var area = d3.geoArea({ type: 'Polygon', coordinates: [r] });
        if (i === 0 ? area > TWO_PI : area < TWO_PI) r = r.slice().reverse();
        return r;
      }).filter(function (r) { return r && r.length >= 4; });
    }).filter(function (p) { return p.length; });

  }
  function loadWorld() {
    var urls = ['https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/world.js', 'https://unpkg.com/echarts@4.9.0/map/js/world.js'];
    var captured = null;
    window.echarts = { registerMap: function (name, geo) { captured = geo; } };
    function attempt(i) {
      if (i >= urls.length) { G.landState = 'failed'; G.sync(); return; }
      var sc = document.createElement('script');
      sc.src = urls[i];
      sc.onload = function () {
        try {
          if (!captured) throw new Error('vide');
          G.land = buildLand(captured); G.landState = 'ok'; captured = null;
          delete window.echarts;
          G.sync(); G.draw(performance.now());
        } catch (err) { attempt(i + 1); }
      };
      sc.onerror = function () { attempt(i + 1); };
      document.head.appendChild(sc);
    }
    attempt(0);
  }

  function round5(x) { return Math.round(x * 1e5) / 1e5; }
  async function searchPlaces(q) {
    var pc = parseCoords(q);
    if (pc) return [{ name: 'Lieu choisi', sub: pc.lat.toFixed(5) + ', ' + pc.lon.toFixed(5), lat: pc.lat, lon: pc.lon }];
    var url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=fr&q=' + encodeURIComponent(q);
    var r;
    try { r = await fetch(url, { headers: { 'Accept': 'application/json' } }); }
    catch (e) { throw { msg: 'Pas de connexion. Réessayez ou placez le point sur le globe.' }; }
    if (!r.ok) throw { msg: 'Recherche impossible pour le moment. Placez le point sur le globe.' };
    var js = await r.json();
    if (!js || !js.length) throw { msg: 'Adresse introuvable. Vérifiez l’orthographe ou placez le point sur le globe.' };
    return js.map(function (x) {
      var parts = String(x.display_name || '').split(', ');
      var name = x.name && x.name.length > 1 ? x.name : parts.slice(0, 2).join(' ');
